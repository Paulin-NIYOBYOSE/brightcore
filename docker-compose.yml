# BrightCore Careers: local evaluation stack.
#
#   cp .env.example .env                           # then set the passwords
#   docker compose up --build                      # app on http://localhost:3000
#   docker compose --profile test run --rm test    # automated tests
#
# Startup order: db (healthy) -> migrate (applies migrations and seeds, then
# exits) -> app. Data lives in named volumes and survives restarts.

name: brightcore

x-database-url: &database-url "postgresql://${POSTGRES_USER:-brightcore}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-brightcore}?schema=public"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brightcore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-brightcore}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the separate test database the first time the volume is initialised.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      # Published on localhost only, for running the app or tests outside Docker.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 3s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      target: builder
    # Both steps are safe to repeat: migrate deploy only applies new
    # migrations, and the seed never overwrites existing records.
    command: ["sh", "-c", "npx prisma migrate deploy && npx prisma db seed"]
    environment:
      DATABASE_URL: *database-url
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      APP_TIMEZONE: ${APP_TIMEZONE:-Africa/Kigali}
      CV_STORAGE_DIR: /app/storage/cvs
      SEED_SAMPLE_DATA: ${SEED_SAMPLE_DATA:-true}
    volumes:
      - cv_storage:/app/storage/cvs
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      DATABASE_URL: *database-url
      APP_TIMEZONE: ${APP_TIMEZONE:-Africa/Kigali}
      CV_STORAGE_DIR: /app/storage/cvs
      # This stack serves plain HTTP on localhost, so the session cookie cannot
      # require HTTPS. Behind HTTPS, set SESSION_COOKIE_SECURE=true.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    volumes:
      - cv_storage:/app/storage/cvs
    depends_on:
      migrate:
        condition: service_completed_successfully

  test:
    profiles: ["test"]
    build:
      context: .
      target: builder
    command: ["npm", "test"]
    environment:
      TEST_DATABASE_URL: "postgresql://${POSTGRES_USER:-brightcore}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/brightcore_test?schema=public"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  cv_storage:
