name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          # Throwaway credentials for the job's temporary database container.
          POSTGRES_USER: brightcore
          POSTGRES_PASSWORD: brightcore-ci
          POSTGRES_DB: brightcore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brightcore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://brightcore:brightcore-ci@localhost:5432/brightcore_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
